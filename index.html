<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown Game</h1>
        
        <div class="game-area">
            <div class="countdown" id="countdown">15</div>
            
            <button class="btn" id="button" disabled>Press when it's 0!</button>
            
            <div class="result" id="result"></div>
            
            <button class="btn btn-restart" id="restart">Play again</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
